name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: hoku-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test release targets
    uses: ./.github/workflows/ci.yml
    with:
      package: true
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Download platform archives
        uses: actions/download-artifact@v7
        with:
          pattern: hoku-*
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(hoku-linux-x86_64.AppImage hoku-linux-x86_64.deb hoku-linux-x86_64.rpm \
            hoku-windows-x86_64-setup.exe hoku-windows-x86_64.zip hoku-macos-arm64.zip)
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          printf '%s\n' "${assets[@]}"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(hoku-linux-x86_64.AppImage hoku-linux-x86_64.deb hoku-linux-x86_64.rpm \
            hoku-windows-x86_64-setup.exe hoku-windows-x86_64.zip hoku-macos-arm64.zip)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Hoku $GITHUB_REF_NAME" --generate-notes
          fi
